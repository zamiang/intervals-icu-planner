name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # Secrets are unavailable to pull_request runs from forks, so the review
    # would always fail there — run it only for same-repo branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned to a commit: this action holds the OAuth token in a public repo,
      # and @v1 moves several times a week. Dependabot proposes updates.
      - uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            Review this pull request for the intervals-icu-planner CLI.

            Focus on:
            - Logic bugs in the scheduling algorithm (src/scheduler.ts), including
              edge cases when days are locked, when slots are insufficient, and
              at TSB classification boundaries.
            - Correctness of Intervals.icu API calls — request shape,
              response parsing, error handling, and auth header construction.
            - TypeScript safety: any/unknown casts that bypass checking,
              non-exhaustive switches over WorkoutType, and runtime-only
              invariants that should be enforced by types.
            - Test quality: tests that would pass even if the code were broken,
              overly mocked tests, and critical paths without coverage.
            - Configuration handling: silent defaults that could mask user
              errors, or validation gaps.

            Do not comment on formatting or style — Prettier and ESLint
            already run in CI. Keep comments concrete with file:line refs.
